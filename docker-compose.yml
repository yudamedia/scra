services:
  postgres:
    image: postgres:16-alpine
    container_name: scra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scra
      POSTGRES_PASSWORD: scra_dev_password
      POSTGRES_DB: scra
    ports:
      - "5432:5432"
    volumes:
      - scra_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scra"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  scra_pg_data:
